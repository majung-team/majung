<text x="197.5" y="615" text-anchor="middle" font-size="14" fill="#3e535f">픽업 ID · 토큰 · 다음 순번</text>
<text x="197.5" y="638" text-anchor="middle" font-size="14" fill="#3e535f">위치·ETA는 파일에 저장 안 함</text>
