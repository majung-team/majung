<text x="617.5" y="187" text-anchor="middle" font-size="19" font-weight="700" fill="#173d35">PickupSharingService</text>
<text x="617.5" y="215" text-anchor="middle" font-size="14" fill="#3e535f">공유 중 알림 · 서버 상태 조회</text>
