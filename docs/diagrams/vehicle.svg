<text x="197.5" y="772" text-anchor="middle" font-size="19" font-weight="700" fill="#173d35">Android Keystore</text>
<text x="197.5" y="800" text-anchor="middle" font-size="14" fill="#3e535f">AES-GCM 암호화 키</text>
<rect x="465" y="555" width="305" height="110" rx="12" fill="#f3f8f5" stroke="#afc9be" stroke-width="1.5"/>
<text x="617.5" y="587" text-anchor="middle" font-size="19" font-weight="700" fill="#173d35">PickupApiClient</text>
<text x="617.5" y="615" text-anchor="middle" font-size="14" fill="#3e535f">단일 worker에서 HTTP 요청</text>
<text x="617.5" y="638" text-anchor="middle" font-size="14" fill="#3e535f">결과는 메인 스레드로 전달</text>
<rect x="885" y="555" width="320" height="110" rx="12" fill="#f3f8f5" stroke="#afc9be" stroke-width="1.5"/>
<text x="1045.0" y="587" text-anchor="middle" font-size="19" font-weight="700" fill="#173d35">백엔드 API</text>
<text x="1045.0" y="615" text-anchor="middle" font-size="14" fill="#3e535f">운전자 권한 · 상태 · 순번 검사</text>
<text x="1045.0" y="638" text-anchor="middle" font-size="14" fill="#3e535f">차량 정보 저장·조회</text>
