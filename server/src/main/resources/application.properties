spring.application.name=majung-server
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/majung;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
majung.invite-ttl=PT15M
majung.pickup-ttl=PT2H
majung.vehicle-freshness=PT30S
