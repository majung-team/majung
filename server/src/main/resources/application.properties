spring.application.name=majung-server
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/majung;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
majung.invite-ttl=PT15M
majung.pickup-ttl=PT2H
majung.vehicle-freshness=PT30S
server.forward-headers-strategy=none
server.max-http-request-header-size=8KB
majung.deployment=false
majung.creation-key=${MAJUNG_CREATION_KEY:}
majung.development-tools=true
majung.rate-limit.enabled=true
majung.rate-limit.requests-per-minute=240
majung.rate-limit.writes-per-minute=90
majung.rate-limit.max-clients=10000
majung.retention.enabled=false
majung.retention.period=PT24H
majung.retention.cleanup-interval-ms=300000
